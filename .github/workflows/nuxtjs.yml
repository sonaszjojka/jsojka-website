# Builds the Nuxt site and deploys it to GitHub Pages.
#
# To get started with Nuxt see: https://nuxt.com/docs/getting-started/installation
name: Deploy Nuxt site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Setup Pages
        id: pages
        # Deliberately no `static_site_generator: nuxt`. That option writes a
        # Nuxt 2 config (`router.base`, `target: static`), and because it only
        # looks for nuxt.config.{js,cjs,mjs} it does not see our nuxt.config.ts
        # and creates a nuxt.config.js instead. That generated file wins during
        # config resolution and drops our `modules` and `css`, which builds the
        # site without Nuxt UI, Tailwind or main.css. We set the base path
        # ourselves via NUXT_APP_BASE_URL below.
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Static HTML export with Nuxt
        run: npm run generate
        env:
          # "/jsojka-website" for a project page, "" for a user page, which
          # nuxt.config.ts falls back to "/" for.
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.output/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
